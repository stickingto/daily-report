name: Daily Report Email

on:
  schedule:
    # 北京时间每天早上8点05分 = UTC 0点05分
    # 避开整点（GitHub Actions整点高峰会跳过定时触发）
    - cron: '5 0 * * *'
  # 支持手动触发测试
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate and send daily report
        env:
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          RECEIVER_EMAILS: ${{ vars.RECEIVER_EMAILS }}
        run: python report.py
