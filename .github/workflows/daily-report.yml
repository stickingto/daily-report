name: Daily Report Email

on:
  schedule:
    # 北京时间每天早上8点左右收到 = UTC 20点05分（凌晨4:05触发）
    # GitHub Actions免费版schedule延迟约4小时，故提前4小时触发
    - cron: '5 20 * * *'
  # 支持手动触发测试
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate and send daily report
        env:
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          RECEIVER_EMAILS: ${{ vars.RECEIVER_EMAILS }}
        run: python report.py
